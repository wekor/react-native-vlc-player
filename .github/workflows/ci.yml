name: CI
# Changes land on master through squash-merged PRs, so CI runs on the PR only;
# re-running it on the merge commit would test the same tree twice.
#
# This workflow runs on every PR and covers the JS side. The native builds live
# in android.yml and ios.yml, which only run when their sources change.
on:
  pull_request:
    branches:
      - master
    # release-please's release PR touches only these files (version bump +
    # changelog). Skipping it avoids a full native rebuild for a version bump,
    # and the run GitHub would otherwise hold for approval because a bot opened
    # the PR. Caveat: a PR that changes nothing but these files skips CI too.
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - package.json
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build example for Web
        run: |
          yarn example build:web
